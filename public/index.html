<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CSM Q&amp;A Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>CSM Q&amp;A Drill</h1>
      <p>Practise the 15-minute Q&amp;A for Communication &amp; Stakeholder Management. Every answer is judged on theory, application and reflection.</p>
    </div>
    <nav class="tabs" aria-label="Modes">
      <button class="tab" data-mode="mock">Mock Q&amp;A</button>
      <button class="tab" data-mode="hot">Hot seat</button>
      <button class="tab" data-mode="cards">Theory cards</button>
      <button class="tab" data-mode="wall">Locker wall</button>
      <button class="tab" data-mode="profile">My project</button>
    </nav>
  </header>
  <div class="status" id="status"></div>
  <div class="grid">
    <main id="main" aria-live="polite"></main>
    <aside>
      <section class="card wall" id="wallCard"></section>
      <section class="card" id="logCard">
        <h2 class="h-small">Recent answers</h2>
        <ul class="log" id="log"></ul>
      </section>
    </aside>
  </div>
  <footer class="foot">Runs locally. Your project profile and progress stay in this browser. Voice input uses your browser's speech recognition.</footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
